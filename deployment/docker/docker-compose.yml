version: "3.8"

services:
  backend:
    build:
      context: ../../
      dockerfile: deployment/docker/Dockerfile.backend
    container_name: mesh-backend
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - MODEL_CHECKPOINT_PATH=./ml/checkpoints/latest.pt
      - PREPROCESSOR_PATH=./ml/checkpoints/scaler.pkl
      - LOG_LEVEL=INFO
    volumes:
      - ../../ml/checkpoints:/app/ml/checkpoints:ro
      - ../../data/processed:/app/data/processed:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  frontend:
    build:
      context: ../../
      dockerfile: deployment/docker/Dockerfile.frontend
    container_name: mesh-frontend
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://backend:8000
    depends_on:
      - backend
    restart: unless-stopped
