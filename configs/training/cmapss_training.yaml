experiment_name: "cmapss_baseline"
log_dir: "logs/"
checkpoint_dir: "checkpoints/cmapss/"
checkpoint_name: "cmapss_v1_trained.pt"
dataset_path: "data/processed/cmapss_fd001/train/data.npz"
dataset_name: "cmapss"

batch_size: 32
epochs: 100
early_stopping_patience: 20
variance_warmup_epochs: 1
learning_rate: 0.0005
weight_decay: 0.0001
clip_grad: 1.0

loss_weights:
  rul: 1.0
  fault: 0.0 # Disabled
  anomaly: 1.0

modality_dropout_p: 0.15

target_normalization:
  rul_mean: 100.3595
  rul_std: 65.5573
